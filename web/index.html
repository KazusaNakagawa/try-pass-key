<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>try-pass-key</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>try-pass-key</h1>
      <p>パスキー（WebAuthn）学習用 PoC</p>

      <section id="session-section" aria-live="polite">
        <h2>ログイン状態</h2>
        <pre id="me">確認中...</pre>
        <!-- Outside #login-section, which is hidden once logged in, so the outcome stays visible. -->
        <pre id="login-result" aria-live="polite"></pre>
        <button id="logout" type="button" hidden>ログアウト</button>
      </section>

      <section id="login-section">
        <h2>パスキーでログイン</h2>
        <form id="login-form">
          <label>
            ユーザー名（入力欄を選ぶと、保存済みのパスキーが候補に出ます）
            <!-- "webauthn" in autocomplete enables Conditional UI (passkeys in autofill). -->
            <input id="login-username" name="username" autocomplete="username webauthn" />
          </label>
          <button id="login-button" type="button">パスキーでログイン</button>
        </form>
      </section>

      <section id="register-section">
        <h2>パスキーを作成</h2>
        <form id="register-form">
          <label>
            表示名（認証器や同期先に保存されることがあります。テスト用の名前を使ってください）
            <input
              id="display-name"
              name="displayName"
              value="test-user-1"
              maxlength="64"
              required
            />
          </label>
          <button type="submit">パスキーを作成</button>
        </form>
        <pre id="register-result" aria-live="polite"></pre>
      </section>

      <section>
        <h2>サーバー状態</h2>
        <pre id="health">確認中...</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
