name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mask-check:
    name: Masking check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check for personal information
        env:
          # One extended regex per line. Set as a repository secret; never commit it.
          MASK_PATTERNS: ${{ secrets.MASK_PATTERNS }}
        run: bash scripts/mask-check.sh

  check:
    name: Typecheck, lint, test (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker compose build
      # The deps service runs first (depends_on). CI=true makes Yarn install immutably,
      # so a yarn.lock that is out of date fails here.
      - name: yarn check
        run: docker compose run --rm server yarn check
      - name: Start the stack (M1 acceptance)
        run: docker compose up -d --wait
      - name: Health check through the web proxy
        run: |
          body="$(curl -fsS http://localhost:5173/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"credentials"'
      - name: E2E (Playwright + virtual authenticator, throwaway stack)
        run: bash scripts/e2e.sh
      - name: Nothing leaked to the host checkout
        run: |
          # ./node_modules is only the empty mount point of the named volume.
          leaked="$(find node_modules -mindepth 1 -maxdepth 1 2>/dev/null; \
            ls -d shared/node_modules server/node_modules web/node_modules e2e/node_modules \
              e2e/test-results .yarn 2>/dev/null; \
            git ls-files --others --exclude-standard)"
          if [[ -n "$leaked" ]]; then
            echo "::error::Files were created on the host:"
            echo "$leaked"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
