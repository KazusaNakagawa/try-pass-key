name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mask-check:
    name: Masking check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check for personal information
        env:
          # One extended regex per line. Set as a repository secret; never commit it.
          MASK_PATTERNS: ${{ secrets.MASK_PATTERNS }}
        run: bash scripts/mask-check.sh

  check:
    name: Typecheck, lint, test (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Detect app scaffold
        id: scaffold
        run: |
          if [[ -f compose.yaml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::compose.yaml not found yet (before M1). Skipping yarn check."
          fi
      - name: Build images
        if: steps.scaffold.outputs.present == 'true'
        run: docker compose build server
      - name: Install dependencies
        if: steps.scaffold.outputs.present == 'true'
        run: docker compose run --rm server yarn install --immutable
      - name: yarn check
        if: steps.scaffold.outputs.present == 'true'
        run: docker compose run --rm server yarn check
      - name: Tear down
        if: always() && steps.scaffold.outputs.present == 'true'
        run: docker compose down -v
